[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-config-validator"
version = "0.2.0"
description = "A small, testable CLI for validating JSON configuration files against a schema."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Make4T" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]
yaml = ["PyYAML>=6.0"]

[project.scripts]
config-validator = "config_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
